version: 2

models:
  - name: dim_restaurants
    columns:
      - name: restaurant_id
        tests: [unique, not_null]

  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: fct_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['Delivered', 'Cancelled', 'Refunded']

  - name: fct_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
